name: shahid_soleimani_library
description: Shahid Haj Qasem Soleimani Library
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependency_overrides:
  archive: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  animate_do: ^3.1.2
  dicebear_offline: ^1.3.6
  flutter_svg: ^2.0.9
  pdf_render_maintained: ^1.5.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  flutter_audio_visualizer: 0.1.1
  background_downloader: ^7.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  dio: ^5.4.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  intl: ^0.19.0
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  min_sdk_android: 21
  ios: true
  image_path_ios: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#1B5E20"
    theme_color: "#1B5E20"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  linux:
    generate: true
    image_path: "assets/icon/app_icon.png"