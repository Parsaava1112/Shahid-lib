name: shahid_soleimani_library
description: کتابخانه شهید حاج قاسم سلیمانی - دانش، نور است
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# ──────────────────────────────────────────────
# وابستگی‌های اصلی
# ──────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──
  flutter_riverpod: ^2.4.0

  # ── Animations ──
  animate_do: ^3.1.2

  # ── Avatars (DiceBear) ──
  dicebear_offline: ^1.3.6
  flutter_svg: ^2.0.9

  # ── PDF Viewer ──
  pdf_render_maintained: ^1.5.0

  # ── Audio Player ──
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.11
  flutter_audio_visualizer: ^0.1.1

  # ── Download Manager ──
  background_downloader: ^7.7.0

  # ── Offline-First / Local Storage ──
  hive_io: ^3.0.0
  hive_flutter: ^3.0.0
  local_first: ^0.6.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # ── Networking ──
  dio: ^5.4.0

  # ── UI ──
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1

  # ── Utilities ──
  intl: ^0.19.0
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.2

# ──────────────────────────────────────────────
# وابستگی‌های توسعه
# ──────────────────────────────────────────────
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator_io: ^3.0.0

  # ── Launcher Icon Generator ──
  flutter_launcher_icons: ^0.14.3

# ──────────────────────────────────────────────
# تنظیمات Flutter
# ──────────────────────────────────────────────
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

# ══════════════════════════════════════════════
#  🎨 تنظیمات آیکون اپلیکیشن (flutter_launcher_icons)
# ══════════════════════════════════════════════
#  dart run flutter_launcher_icons

    - assets/icon/app_icon.png         (1024x1024 px - آیکون اصلی)

# ══════════════════════════════════════════════

flutter_launcher_icons:
  # ── تنظیمات عمومی ──
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

  # ── Android ──
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#1B5E20"          # رنگ سبز پرچم
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_foreground_inset: 16           # درصد حاشیه داخلی
  adaptive_icon_monochrome: "assets/icon/adaptive_monochrome.png"

  # ── iOS ──
  ios: true
  image_path_ios: "assets/icon/app_icon.png"
  remove_alpha_ios: true

  # ── Web ──
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#1B5E20"
    theme_color: "#1B5E20"

  # ── Windows ──
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48

  # ── macOS ──
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

  # ── Linux ──
  linux:
    generate: true
    image_path: "assets/icon/app_icon.png"