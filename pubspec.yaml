name: shahid_suleimani_library
description: کتابخانه مدرسه استعداد های درخشان شهید بهشتی ناحیه ۲ شهرری متوسطه اول
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  google_fonts: ^6.2.1
  pdfrx: ^1.0.78
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  just_audio_background: ^0.0.1-beta.13
  awesome_video_player: ^1.0.5
  dio: ^5.7.0
  path_provider: ^2.1.4
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.1
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  wakelock_plus: ^1.2.8
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
