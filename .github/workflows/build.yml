name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ==================== ۱. دریافت کد ====================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================== ۲. راه‌اندازی Java ====================
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ==================== ۳. راه‌اندازی Flutter ====================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      # ==================== ۴. بررسی نسخه‌ها ====================
      - name: Verify Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      # ==================== ۵. نصب وابستگی‌ها ====================
      - name: Install dependencies
        run: flutter pub get

      # ==================== ۷. ساخت APK واحد ====================
      - name: Build single APK (release)
        run: flutter build apk --release

      # ==================== ۸. آپلود APK ====================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shahid-suleimani-library-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30